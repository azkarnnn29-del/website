<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrumen — Jam & Kalkulator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg: #17161a;
    --panel: #201f24;
    --panel-raised: #2a2930;
    --brass: #c9973f;
    --brass-dim: #8a6a30;
    --ink: #e9e4d8;
    --ink-dim: #8b8780;
    --lcd: #e8c66b;
    --shadow: rgba(0,0,0,0.55);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, #232228 0%, #17161a 55%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    padding:32px 16px;
  }

  .instrument{
    width:380px;
    max-width:100%;
    background:linear-gradient(180deg, #24232a 0%, #1c1b20 100%);
    border-radius:22px;
    padding:22px;
    box-shadow:
      0 30px 60px -20px var(--shadow),
      inset 0 1px 0 rgba(255,255,255,0.04),
      inset 0 0 0 1px rgba(255,255,255,0.03);
    position:relative;
  }

  .instrument::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:22px;
    padding:1px;
    background:linear-gradient(180deg, rgba(201,151,63,0.25), transparent 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events:none;
  }

  .brand{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.18em;
    color:var(--ink-dim);
    text-transform:uppercase;
    margin-bottom:16px;
  }
  .brand .dot{ width:6px; height:6px; border-radius:50%; background:var(--brass); box-shadow:0 0 6px var(--brass); display:inline-block; margin-right:6px; }

  /* ===== Clock section ===== */
  .clock-panel{
    display:flex;
    align-items:center;
    gap:18px;
    background:var(--panel);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
  }

  .clock-face{
    position:relative;
    width:104px;
    height:104px;
    min-width:104px;
    border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, #35333b, #1a191e 70%);
    box-shadow:
      inset 0 0 0 1px rgba(201,151,63,0.35),
      inset 0 4px 10px rgba(0,0,0,0.6),
      0 2px 4px rgba(0,0,0,0.4);
  }

  .tick{
    position:absolute;
    top:50%; left:50%;
    width:2px; height:8px;
    background:var(--ink-dim);
    transform-origin:1px 44px;
  }
  .tick.major{ background:var(--brass); height:10px; width:2px; }

  .hand{
    position:absolute;
    left:50%; bottom:50%;
    transform-origin:50% 100%;
    border-radius:4px;
    background:var(--ink);
  }
  .hand.hour{ width:4px; height:26px; margin-left:-2px; background:var(--ink); }
  .hand.minute{ width:3px; height:38px; margin-left:-1.5px; background:var(--ink); }
  .hand.second{ width:1.5px; height:44px; margin-left:-0.75px; background:var(--brass); }
  .hub{
    position:absolute; top:50%; left:50%;
    width:8px; height:8px; margin:-4px 0 0 -4px;
    border-radius:50%;
    background:var(--brass);
    box-shadow:0 0 4px rgba(201,151,63,0.6);
    z-index:5;
  }

  .clock-readout{ flex:1; min-width:0; }
  .digital-time{
    font-family:'IBM Plex Mono', monospace;
    font-size:26px;
    font-weight:600;
    color:var(--lcd);
    text-shadow:0 0 10px rgba(232,198,107,0.35);
    letter-spacing:0.02em;
    line-height:1.1;
  }
  .digital-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  /* ===== Divider ===== */
  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(201,151,63,0.4), transparent);
    margin:14px 0;
  }

  /* ===== Calculator ===== */
  .calc-display{
    background:var(--panel);
    border-radius:14px;
    padding:18px 16px;
    text-align:right;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.45);
    margin-bottom:14px;
    overflow:hidden;
  }
  .calc-expr{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-dim);
    min-height:16px;
    overflow-x:auto;
    white-space:nowrap;
  }
  .calc-value{
    font-family:'IBM Plex Mono', monospace;
    font-size:34px;
    font-weight:600;
    color:var(--lcd);
    text-shadow:0 0 10px rgba(232,198,107,0.3);
    overflow-x:auto;
    white-space:nowrap;
    margin-top:2px;
  }

  .keys{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
  }

  button.key{
    font-family:'IBM Plex Mono', monospace;
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    background:var(--panel-raised);
    border:none;
    border-radius:12px;
    padding:16px 0;
    cursor:pointer;
    box-shadow:
      0 2px 0 rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.15s ease;
  }
  button.key:active{
    transform: translateY(2px);
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.5);
  }

  button.key.op{
    color:var(--brass);
    background:#26232a;
  }
  button.key.func{
    color:var(--ink-dim);
    background:#26232a;
    font-size:14px;
  }
  button.key.equals{
    background:linear-gradient(180deg, var(--brass), var(--brass-dim));
    color:#1a1710;
    font-weight:700;
    box-shadow:
      0 2px 0 #6d5322,
      inset 0 1px 0 rgba(255,255,255,0.25);
  }
  button.key.equals:active{
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.4);
  }
  button.key.zero{ grid-column: span 2; }

  @media (max-width:400px){
    .instrument{ padding:16px; }
    .clock-face{ width:88px; height:88px; min-width:88px; }
    .digital-time{ font-size:22px; }
  }
</style>
</head>
<body>

<div class="instrument">
  <div class="brand"><span><span class="dot"></span>PANEL INSTRUMEN</span><span>MODEL 01</span></div>

  <div class="clock-panel">
    <div class="clock-face" id="clockFace">
      <div class="hub"></div>
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
      <div class="hand second" id="secondHand"></div>
    </div>
    <div class="clock-readout">
      <div class="digital-time" id="digitalTime">00:00:00</div>
      <div class="digital-date" id="digitalDate">— — —</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="calc-display">
    <div class="calc-expr" id="calcExpr">&nbsp;</div>
    <div class="calc-value" id="calcValue">0</div>
  </div>

  <div class="keys">
    <button class="key func" onclick="clearAll()">C</button>
    <button class="key func" onclick="toggleSign()">±</button>
    <button class="key func" onclick="percent()">%</button>
    <button class="key op" onclick="chooseOp('÷')">÷</button>

    <button class="key" onclick="inputDigit('7')">7</button>
    <button class="key" onclick="inputDigit('8')">8</button>
    <button class="key" onclick="inputDigit('9')">9</button>
    <button class="key op" onclick="chooseOp('×')">×</button>

    <button class="key" onclick="inputDigit('4')">4</button>
    <button class="key" onclick="inputDigit('5')">5</button>
    <button class="key" onclick="inputDigit('6')">6</button>
    <button class="key op" onclick="chooseOp('-')">-</button>

    <button class="key" onclick="inputDigit('1')">1</button>
    <button class="key" onclick="inputDigit('2')">2</button>
    <button class="key" onclick="inputDigit('3')">3</button>
    <button class="key op" onclick="chooseOp('+')">+</button>

    <button class="key zero" onclick="inputDigit('0')">0</button>
    <button class="key" onclick="inputDecimal()">.</button>
    <button class="key equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
  // ===== Jam analog & digital =====
  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');
  const digitalTime = document.getElementById('digitalTime');
  const digitalDate = document.getElementById('digitalDate');
  const clockFace = document.getElementById('clockFace');

  // Buat tanda menit/jam pada bezel
  for(let i=0;i<60;i++){
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    tick.style.transform = `translate(-50%,-50%) rotate(${i*6}deg)`;
    if(i % 5 !== 0) tick.style.opacity = '0.35';
    clockFace.appendChild(tick);
  }

  const hariList = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const bulanList = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

  function updateClock(){
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    const hourDeg = (h % 12) * 30 + m * 0.5;
    const minDeg = m * 6 + s * 0.1;
    const secDeg = s * 6;

    hourHand.style.transform = `rotate(${hourDeg}deg)`;
    minuteHand.style.transform = `rotate(${minDeg}deg)`;
    secondHand.style.transform = `rotate(${secDeg}deg)`;

    const pad = n => String(n).padStart(2,'0');
    digitalTime.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    digitalDate.textContent = `${hariList[now.getDay()]}, ${now.getDate()} ${bulanList[now.getMonth()]} ${now.getFullYear()}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ===== Kalkulator =====
  const calcValue = document.getElementById('calcValue');
  const calcExpr = document.getElementById('calcExpr');

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;

  function render(){
    calcValue.textContent = current;
    calcExpr.textContent = previous !== null ? `${previous} ${operator}` : '\u00A0';
  }

  function inputDigit(d){
    if(overwrite){
      current = d;
      overwrite = false;
    } else {
      current = current === '0' ? d : current + d;
    }
    render();
  }

  function inputDecimal(){
    if(overwrite){
      current = '0.';
      overwrite = false;
      render();
      return;
    }
    if(!current.includes('.')) current += '.';
    render();
  }

  function toggleSign(){
    current = String(parseFloat(current) * -1);
    render();
  }

  function percent(){
    current = String(parseFloat(current) / 100);
    render();
  }

  function clearAll(){
    current = '0';
    previous = null;
    operator = null;
    overwrite = true;
    render();
  }

  function chooseOp(op){
    if(operator !== null && !overwrite){
      calculate();
    }
    previous = current;
    operator = op;
    overwrite = true;
    render();
  }

  function calculate(){
    if(operator === null || previous === null) return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let result = 0;
    switch(operator){
      case '+': result = a + b; break;
      case '-': result = a - b; break;
      case '×': result = a * b; break;
      case '÷': result = b === 0 ? NaN : a / b; break;
    }
    current = String(Number.isNaN(result) ? 'Error' : parseFloat(result.toFixed(10)));
    previous = null;
    operator = null;
    overwrite = true;
    render();
  }

  // Dukungan keyboard
  window.addEventListener('keydown', (e) => {
    if(e.key >= '0' && e.key <= '9') inputDigit(e.key);
    else if(e.key === '.') inputDecimal();
    else if(e.key === '+') chooseOp('+');
    else if(e.key === '-') chooseOp('-');
    else if(e.key === '*') chooseOp('×');
    else if(e.key === '/'){ e.preventDefault(); chooseOp('÷'); }
    else if(e.key === 'Enter' || e.key === '=') calculate();
    else if(e.key === 'Escape') clearAll();
  });

  render();
</script>

</body>
</html>
